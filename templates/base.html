<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ site.name }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ site.description }}{% endblock %}" />
    <meta name="robots" content="{{ 'noindex, follow' if noindex else 'index, follow' }}" />
    <link rel="canonical" href="{{ site.url }}" />
    <meta name="theme-color" content="#2962ff" />
    <meta name="author" content="{{ site.author }}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ site.name }}" />
    <meta property="og:title" content="{{ self.title() }}" />
    <meta property="og:description" content="{{ self.description() }}" />
    <meta property="og:url" content="{{ site.url }}" />
    <meta property="og:image" content="{{ site.url }}static/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{ site.name }} — {{ site.tagline }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ self.title() }}" />
    <meta name="twitter:description" content="{{ self.description() }}" />
    <meta name="twitter:image" content="{{ site.url }}static/og.png" />
    <link rel="icon" href="{{ asset('favicon.svg') }}" type="image/svg+xml" />
    <link rel="stylesheet" href="{{ asset('style.css') }}" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "{{ site.name }}",
      "alternateName": "{{ site.tagline }}",
      "description": "{{ site.description }}",
      "url": "{{ site.url }}",
      "applicationCategory": "EntertainmentApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": { "@type": "Person", "name": "{{ site.author }}", "url": "{{ site.author_url }}" }
    }
    </script>
  </head>
  <body>
    <main class="stack">
      {% block content %}{% endblock %}
    </main>
    <footer class="credit muted small">© {{ year }} <a href="{{ site.author_url }}" rel="author">{{ site.author }}</a></footer>
    <script src="{{ asset('app.js') }}" defer></script>
  </body>
</html>
